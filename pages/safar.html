<!-- Linking our magic global script -->
<script src="../js/sbr-ai-core.js"></script>

<script>
function triggerGeminiSafar() {
    const prompt = document.getElementById('gemini-safar-text-input').value.trim();
    if (!prompt) return;
    // Calling central AI core engine with 'gemini' type
    askSBRSuperAppAI('gemini', "Act as an Islamic travel locator. Help me find or plan for this location request: " + prompt, 'gemini-safar-response-screen', 'gemini-safar-submit-btn');
}
</script>
