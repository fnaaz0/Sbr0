name: Build Web App APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: set up Node.js
      uses: actions/setup-node@v4
      with:
        node-size: 20

    - name: Install Bubblewrap
      run: npm install -g @bubblewrap/cli

    - name: Initialize and Build APK
      run: |
        # यहाँ यह आपकी manifest.json से ऐप की डिटेल्स उठाकर सीधा APK जनरेट कर देगा
        bubblewrap init --manifest=manifest.json --meta=metadata.json || true
        bubblewrap build --skipSigning
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: web-app-apk
        path: ./*.apk
        
